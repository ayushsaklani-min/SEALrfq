<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">SEALrfq system architecture</title>
  <desc id="desc">Frontend on Vercel, backend on AWS EC2, and sealrfq_v9.aleo on Aleo testnet with credits.aleo settlement.</desc>
  <style>
    .title { font: 700 24px Arial, sans-serif; fill: #152033; }
    .subtitle { font: 700 14px Arial, sans-serif; fill: #152033; }
    .section { font: 700 20px Arial, sans-serif; fill: #152033; }
    .label { font: 700 14px Arial, sans-serif; fill: #1f2d3d; }
    .text { font: 13px Arial, sans-serif; fill: #24364a; }
    .small { font: 12px Arial, sans-serif; fill: #24364a; }
    .muted { font: 12px Arial, sans-serif; fill: #53657a; }
    .frame { fill: #eef5fb; stroke: #233a67; stroke-width: 2; }
    .cap { fill: #f2f7fc; stroke: #4e78a5; stroke-width: 2; }
    .api { fill: #fde9cf; stroke: #d08a34; stroke-width: 2; }
    .state { fill: #eef5fb; stroke: #4e78a5; stroke-width: 2; }
    .chain { fill: #f4f8fd; stroke: #233a67; stroke-width: 2; }
    .header { fill: #e8f1fa; stroke: #6c9cc8; stroke-width: 2; }
    .line { stroke: #4c5f73; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dashed { stroke: #8aa1b7; stroke-width: 1.5; stroke-dasharray: 6 6; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c5f73"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="1388" height="68" rx="6" class="header"/>
  <text x="18" y="38" class="title">SEALrfq - System Architecture</text>
  <text x="18" y="59" class="subtitle">Bid confidentiality, deterministic winner selection, and escrow settlement are enforced by on-chain program logic.</text>

  <line x1="470" y1="92" x2="470" y2="206" class="dashed"/>
  <line x1="940" y1="92" x2="940" y2="206" class="dashed"/>

  <rect x="150" y="94" width="185" height="44" rx="6" class="state"/>
  <text x="242" y="122" text-anchor="middle" class="section" font-size="16">Buyer (Browser)</text>

  <rect x="610" y="94" width="185" height="44" rx="6" class="state"/>
  <text x="702" y="122" text-anchor="middle" class="section" font-size="16">Vendor (Browser)</text>

  <rect x="1070" y="94" width="205" height="44" rx="6" class="state"/>
  <text x="1172" y="122" text-anchor="middle" class="section" font-size="16">Auditor (Browser)</text>

  <text x="338" y="172" class="section" font-size="15">Shield Wallet</text>
  <text x="338" y="191" class="text">(Aleo Extension)</text>
  <text x="787" y="172" class="section" font-size="15">Shield Wallet</text>
  <text x="787" y="191" class="text">(Aleo Extension)</text>

  <path d="M240 138 C240 164, 268 170, 330 172" class="line"/>
  <path d="M702 138 C702 164, 758 170, 780 172" class="line"/>
  <path d="M374 172 C430 172, 505 185, 530 210" class="line"/>
  <path d="M822 172 C890 172, 975 185, 1000 210" class="line"/>
  <path d="M1172 138 L1172 210" class="line"/>

  <rect x="28" y="210" width="1344" height="142" rx="6" class="frame"/>
  <text x="46" y="348" class="section">Next.js Frontend</text>
  <text x="1205" y="374" class="section" font-size="16">Vercel (Frontend Host)</text>

  <rect x="46" y="228" width="398" height="88" rx="8" class="cap"/>
  <text x="245" y="251" text-anchor="middle" class="label">Capability module</text>
  <rect x="58" y="268" width="118" height="42" rx="6" class="state"/>
  <rect x="188" y="268" width="118" height="42" rx="6" class="state"/>
  <rect x="318" y="268" width="118" height="42" rx="6" class="state"/>
  <text x="117" y="294" text-anchor="middle" class="text">Create RFQ</text>
  <text x="247" y="294" text-anchor="middle" class="text">Close Bid</text>
  <text x="377" y="294" text-anchor="middle" class="text">Select Win</text>

  <rect x="475" y="228" width="363" height="88" rx="8" class="api"/>
  <text x="656" y="251" text-anchor="middle" class="label">Capability module</text>
  <rect x="487" y="268" width="114" height="42" rx="6" class="api"/>
  <rect x="613" y="268" width="114" height="42" rx="6" class="api"/>
  <rect x="739" y="268" width="87" height="42" rx="6" class="api"/>
  <text x="544" y="294" text-anchor="middle" class="text">Commit Bid</text>
  <text x="670" y="294" text-anchor="middle" class="text">Accept Win</text>
  <text x="782" y="294" text-anchor="middle" class="text">Decline</text>

  <rect x="848" y="228" width="118" height="88" rx="8" class="cap"/>
  <text x="907" y="251" text-anchor="middle" class="label">Capability</text>
  <rect x="860" y="268" width="94" height="42" rx="6" class="state"/>
  <text x="907" y="294" text-anchor="middle" class="text">Reveal Bid</text>

  <rect x="980" y="228" width="375" height="88" rx="8" class="cap"/>
  <text x="1168" y="251" text-anchor="middle" class="label">Capability module</text>
  <rect x="992" y="268" width="112" height="42" rx="6" class="state"/>
  <rect x="1116" y="268" width="112" height="42" rx="6" class="state"/>
  <rect x="1240" y="268" width="102" height="42" rx="6" class="state"/>
  <text x="1048" y="294" text-anchor="middle" class="text">Escrow Mgmt</text>
  <text x="1172" y="294" text-anchor="middle" class="text">Release Pay</text>
  <text x="1291" y="294" text-anchor="middle" class="text">Audit View</text>

  <rect x="28" y="416" width="1344" height="118" rx="6" class="frame"/>
  <text x="46" y="530" class="section">Next.js Backend</text>
  <text x="1170" y="559" class="section" font-size="16">AWS EC2 (Backend Host)</text>

  <rect x="46" y="442" width="150" height="72" rx="8" class="state"/>
  <text x="121" y="474" text-anchor="middle" class="section" font-size="16">Auth</text>
  <text x="121" y="495" text-anchor="middle" class="text">(Aleo Sig)</text>

  <rect x="216" y="442" width="175" height="72" rx="8" class="api"/>
  <text x="303" y="474" text-anchor="middle" class="section" font-size="16">RFQ API</text>
  <text x="303" y="495" text-anchor="middle" class="text">(CRUD + Lifecycle)</text>

  <rect x="411" y="442" width="175" height="72" rx="8" class="api"/>
  <text x="498" y="474" text-anchor="middle" class="section" font-size="16">Bid API</text>
  <text x="498" y="495" text-anchor="middle" class="text">(Commit + Reveal)</text>

  <rect x="606" y="442" width="185" height="72" rx="8" class="api"/>
  <text x="698" y="474" text-anchor="middle" class="section" font-size="16">Escrow API</text>
  <text x="698" y="495" text-anchor="middle" class="text">(Fund + Release)</text>

  <rect x="811" y="442" width="140" height="72" rx="8" class="api"/>
  <text x="881" y="485" text-anchor="middle" class="section" font-size="16">TX Tracker</text>

  <rect x="971" y="442" width="140" height="72" rx="8" class="state"/>
  <text x="1041" y="474" text-anchor="middle" class="section" font-size="16">Chain State</text>
  <text x="1041" y="495" text-anchor="middle" class="text">(Block Height)</text>

  <rect x="1131" y="442" width="214" height="72" rx="8" class="state"/>
  <text x="1238" y="474" text-anchor="middle" class="section" font-size="16">Event Indexer</text>
  <text x="1238" y="495" text-anchor="middle" class="text">(Polls Aleo RPC for</text>
  <text x="1238" y="512" text-anchor="middle" class="text">on-chain mapping state)</text>

  <line x1="196" y1="478" x2="216" y2="478" class="line"/>
  <line x1="391" y1="478" x2="411" y2="478" class="line"/>
  <line x1="586" y1="478" x2="606" y2="478" class="line"/>
  <line x1="791" y1="478" x2="811" y2="478" class="line"/>
  <line x1="951" y1="478" x2="971" y2="478" class="line"/>
  <line x1="1111" y1="478" x2="1131" y2="478" class="line"/>

  <line x1="700" y1="352" x2="700" y2="416" class="line"/>
  <text x="720" y="398" class="section" font-size="16">HTTPS / JWT Auth</text>

  <rect x="28" y="566" width="1344" height="166" rx="6" class="frame"/>
  <text x="560" y="620" class="section" font-size="18">Aleo Blockchain (Testnet)</text>

  <line x1="700" y1="534" x2="700" y2="566" class="line"/>
  <text x="726" y="556" class="section" font-size="16">Aleo RPC</text>

  <rect x="46" y="620" width="972" height="104" rx="8" class="chain"/>
  <text x="532" y="655" text-anchor="middle" class="section">sealrfq_v9.aleo - 22 Transitions</text>
  <text x="66" y="686" class="label">Mappings:</text>
  <text x="148" y="686" class="text">rfq_status, bid_commitments, revealed_bids, escrow_amounts, bid_stakes, winner_bids, actor_*_nonces</text>
  <text x="66" y="714" class="label">Records:</text>
  <text x="136" y="714" class="text">RFQCreated, BidCommitted, BidRevealed, WinnerSelected, EscrowFunded, PartialPaymentReleased, StakeSlashed ...</text>

  <rect x="1030" y="620" width="323" height="104" rx="8" class="chain"/>
  <text x="1191" y="658" text-anchor="middle" class="section">credits.aleo</text>
  <text x="1191" y="685" text-anchor="middle" class="text">Native ALEO token transfers</text>
  <text x="1191" y="706" text-anchor="middle" class="text">(transfer_public / transfer_public_as_signer)</text>
</svg>
